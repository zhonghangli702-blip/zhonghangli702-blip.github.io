bio: |
  WECOME TO MY WEBSITE! I am an incoming PhD student in Economics at the University of Missouri–Kansas City (Fall 2026).
  My research interests include development economics (with a focus on income distribution), heterodox economics,
  and digital economics.

  My current research plan explores macroeconomic constraints and distributional dynamics, tentatively titled
  "Between External Constraint and Internal Distribution: Interest Rate Policy and the Persistence of Inequality in Argentina".
  My previous research primarily focused on the digital economy, and I am interested in exploring applications of machine learning
  in economic research.

